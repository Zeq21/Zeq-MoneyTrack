<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zeq MoneyTrack</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1>Zeq MoneyTrack</h1>
    <p>Controle suas entradas, saídas e saldo em tempo real.</p>
  </header>

  <main class="container">

    <section class="summary">
      <div class="summary-card">
        <p>Entradas</p>
        <strong id="income-total">R$ 0,00</strong>
      </div>

      <div class="summary-card">
        <p>Saídas</p>
        <strong id="expense-total">R$ 0,00</strong>
      </div>

      <div class="summary-card balance">
        <p>Saldo atual</p>
        <strong id="balance-total">R$ 0,00</strong>
      </div>
    </section>

    <section class="form-section">
      <h2>Nova movimentação</h2>

      <form id="transaction-form">
        <input
          type="text"
          id="description"
          placeholder="Descrição"
          required
        />

        <input
          type="number"
          id="amount"
          placeholder="Valor"
          min="0.01"
          step="0.01"
          required
        />

        <select id="type" required>
          <option value="income">Entrada</option>
          <option value="expense">Saída</option>
        </select>

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="transactions-section">
      <h2>Movimentações</h2>

      <ul id="transactions-list"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
